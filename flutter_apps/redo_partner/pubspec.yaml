name: redo_partner
description: "REDO Partner — Truck Driver & Fleet Owner App"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  google_maps_flutter: 2.9.0
  provider: ^6.1.2
  http: ^1.2.2
  intl: ^0.20.2
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_gen:
  output: lib/gen/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/

